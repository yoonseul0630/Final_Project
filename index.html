 <form id="authForm">
<div class="ring">
  <i style="--clr:#47bcf2;"></i>
  <i style="--clr:#0026e4;"></i>
  <i style="--clr:#c9f8ff;"></i>
  <div class="login">
    <h2>ON PATH</h2>
    <div class="inputBx">
      <input type="text" id="username" placeholder="ID">
    </div>
    <div class="inputBx">
      <input type="password" id="password" placeholder="Password">
    </div>
    <div class="inputBx">
      <!-- <input type="submit" value="Sign in"> -->
      <input type="submit" id="submitBtn" value="Sign in"></button>
    </div>
     <!-- <button type="submit" id="submitBtn">인증 및 VPN 연결</button> -->
    <div id="status"></div>
  </div>
</div>
</form>



    <!--    스크립트   -->>
<script>
    const authForm = document.getElementById('authForm');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    authForm.onsubmit = async (e) => {
        e.preventDefault();
        
        statusDiv.className = '';
        statusDiv.innerText = '서버 검증 중...';
      
        submitBtn.disabled = true;

        const credentials = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            // Netlify Functions의 login 호출
            const response = await fetch('/.netlify/functions/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credentials)
            });

            const result = await response.json();

            if (response.ok && result.status === "success") {
                statusDiv.className = 'success';
                statusDiv.innerHTML = `<strong>인증 성공!</strong><br>환영합니다, ${credentials.username}님.<br>잠시 후 VPN 터널링을 시작합니다.`;
                
                // 여기서 실제 WireGuard Config 다운로드나 실행 로직을 추가하게 됩니다.
                console.log("VPN Key Data:", result.data);
            } else {
                throw new Error(result.message || '인증 정보가 올바르지 않습니다.');
            }
        } catch (err) {
            statusDiv.className = 'error';
            statusDiv.innerText = '인증 실패: ' + err.message;
        } finally {
            submitBtn.disabled = false;
        }
    };
</script>

</body>
