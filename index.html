<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onpath</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #1a73e8; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background: #1557b0; }
        #status { margin-top: 1rem; padding: 10px; border-radius: 6px; display: none; }
        .success { background: #e6f4ea; color: #1e8e3e; display: block !important; }
        .error { background: #fce8e6; color: #d93025; display: block !important; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>onpath</h2>
    <p>로그인하세요</p>
    <form id="authForm">
        <input type="text" id="username" placeholder="ID" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="submitBtn">인증 및 VPN 연결</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const authForm = document.getElementById('authForm');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    authForm.onsubmit = async (e) => {
        e.preventDefault();
        
        // UI 상태 초기화
        statusDiv.className = '';
        statusDiv.innerText = '서버 검증 중...';
        statusDiv.style.display = 'block';
        submitBtn.disabled = true;

        const credentials = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            // Netlify Functions의 login 함수를 호출
            const response = await fetch('/.netlify/functions/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credentials)
            });

            const result = await response.json();

            if (response.ok && result.status === "success") {
                statusDiv.className = 'success';
                statusDiv.innerHTML = `<strong>인증 성공!</strong><br>환영합니다, ${credentials.username}님.<br>잠시 후 VPN 터널링을 시작합니다.`;
                
                // 여기서 실제 WireGuard Config 다운로드나 실행 로직을 추가하게 됩니다.
                console.log("VPN Key Data:", result.data);
            } else {
                throw new Error(result.message || '인증 정보가 올바르지 않습니다.');
            }
        } catch (err) {
            statusDiv.className = 'error';
            statusDiv.innerText = '인증 실패: ' + err.message;
        } finally {
            submitBtn.disabled = false;
        }
    };
</script>

</body>
</html>
