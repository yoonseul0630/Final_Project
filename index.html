    <canvas id="canvas"></canvas>

    <form id="authForm">
        <div class="ring">
            <i style="--clr:#47bcf2;"></i>
            <i style="--clr:#0026e4;"></i>
            <i style="--clr:#c9f8ff;"></i>
            <div class="login">
                <h2 class="title">ONPATH</h2>
                <div class="inputBx">
                    <input type="text" id="username" placeholder="ID">
                </div>
                <div class="inputBx">
                    <input type="password" id="password" placeholder="Password">
                </div>
                <div class="inputBx">
                    <!-- <input type="submit" value="Sign in"> -->
                    <input type="submit" id="submitBtn" value="LOGIN"></button>
                </div>
                <!-- <button type="submit" id="submitBtn">인증 및 VPN 연결</button> -->
                <div id="status"></div>
            </div>
        </div>
    </form>



    <!--    스크립트   -->
    <script>
        const authForm = document.getElementById('authForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        authForm.onsubmit = async (e) => {
            e.preventDefault();

            statusDiv.className = '';
            statusDiv.innerText = '서버 검증 중...';

            submitBtn.disabled = true;

            const credentials = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                // Netlify Functions의 login 호출
                const response = await fetch('/.netlify/functions/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentials)
                });

                const result = await response.json();

                if (response.ok && result.status === "success") {


                    statusDiv.className = 'success';
                    statusDiv.innerHTML = `<strong>인증 성공!</strong><br>환영합니다 ${credentials.username}님<br>잠시 후 이동합니다.`;
                    const username = credentials.username;

                    sessionStorage.setItem("user", username);

                    console.log("VPN Key Data:", result.data);

                    // 2초 뒤에 실제 내부 서버 접속 가이드나 대시보드로 이동
                    setTimeout(() => {
                        window.location.href = "http://192.168.11.254/auth.php?user=" + encodeURIComponent(username); // 바로 내부망 접속 시도
                        // 또는 다른 성공 페이지로 이동
                    }, 2000);
                } else {
                    throw new Error(result.message || '인증 정보가 올바르지 않습니다.');
                }
            } catch (err) {
                statusDiv.className = 'error';
                statusDiv.innerText = '인증 실패: ' + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        };
    </script>
    <script>
        // Matrix Background Logic - 기존 코드 유지
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@&";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00f0ff'; /* 기존 --accent 색상 */
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
